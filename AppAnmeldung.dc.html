<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App – Anmeldung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#245533}a:hover{color:#163A22}
h1,h2,h3{font-family:'Barlow',sans-serif;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:12px;font-weight:600;text-decoration:none;font-size:17px;box-sizing:border-box;border:1px solid transparent;font-family:inherit;cursor:pointer;width:100%}
.btn.pri{background:#2F6B3F;color:#fff}.btn.pri:hover{background:#245533;color:#fff}
.btn.sec{background:#fff;color:#1C2A22;border-color:#C2CCBC}
.btn.off{background:#E1E6DE;color:#5A665F;cursor:not-allowed}
.seg{display:flex;padding:4px;border-radius:12px;background:#E4EAE1;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;background:transparent;color:#2B3A31}
.seg button.on{background:#fff;color:#1C2A22;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fld{display:flex;flex-direction:column;gap:6px}
label{font-weight:600;font-size:15px}
input[type=text],input[type=email],textarea{font-family:inherit;font-size:16px;color:#1C2A22;border:1px solid #C2CCBC;border-radius:10px;padding:12px;background:#fff;box-sizing:border-box;width:100%;min-height:48px}
.step{display:flex;align-items:center;border:1px solid #C2CCBC;border-radius:10px;background:#fff;overflow:hidden}
.step button{width:52px;height:48px;border:0;background:#F2F5EF;font-size:22px;font-family:inherit;cursor:pointer;color:#1C2A22}
.step output{flex:1;text-align:center;font-weight:600;font-size:18px}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:15px;line-height:1.4}
.chk input{width:22px;height:22px;margin:0;accent-color:#2F6B3F;flex:none}
.muted{color:#4F5E55}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F5EF; font-family: 'Source Sans 3', sans-serif; font-size: 16px; color: #1C2A22; overflow: hidden">
  <header style="background: #fff; border-bottom: 1px solid #DCE3D7; padding: 22px 12px 14px; display: flex; align-items: center; gap: 6px">
    <a href="AppBeitrag.dc.html" aria-label="Zurück zum Beitrag" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C2A22"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div><h1 style="font-size: 22px">Anmelden</h1><div class="muted" style="font-size: 14px">Hüttenwochenende · 14.–15.11.</div></div>
  </header>

  <template data-sc="if" value="{{form}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; overflow: hidden; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
      <div class="seg" role="group" aria-label="Art der Anmeldung">
        <template data-sc="if" value="{{single}}" hint-placeholder-val="{{ false }}">
          <button type="button" class="on" aria-pressed="true">Nur ich</button>
          <button type="button" onClick="{{setGroup}}" aria-pressed="false">Gruppe / Familie</button>
        </template>
        <template data-sc="if" value="{{group}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{setSingle}}" aria-pressed="false">Nur ich</button>
          <button type="button" class="on" aria-pressed="true">Gruppe / Familie</button>
        </template>
      </div>
      <div class="fld"><label for="name">{{nameLabel}}</label><input id="name" type="text" value="Familie Weber"></div>
      <div class="fld"><label for="mail">E-Mail für die Bestätigung</label><input id="mail" type="email" value="weber@beispiel.de"></div>
      <template data-sc="if" value="{{group}}" hint-placeholder-val="{{ true }}">
        <div class="fld">
          <span style="font-weight: 600; font-size: 15px">Personen</span>
          <div class="step">
            <button type="button" onClick="{{minus}}" aria-label="Eine Person weniger">−</button>
            <output aria-live="polite">{{persons}}</output>
            <button type="button" onClick="{{plus}}" aria-label="Eine Person mehr">+</button>
          </div>
          <span class="muted" style="font-size: 14px">Noch 12 Plätze frei</span>
        </div>
      </template>
      <div class="fld"><label for="bem">Anmerkung (optional)</label><textarea id="bem" rows="2" placeholder="z. B. vegetarisch, Ankunft erst Samstagabend"></textarea></div>
      <label class="chk"><input type="checkbox" checked="{{ok}}" onChange="{{toggleOk}}"><span>Meine Angaben dürfen für diese Veranstaltung gespeichert werden. <a href="#datenschutz">Datenschutz</a></span></label>
      <div style="margin-top: auto">
        <template data-sc="if" value="{{ok}}" hint-placeholder-val="{{ false }}">
          <button type="button" class="btn pri" onClick="{{submit}}">Verbindlich anmelden</button>
        </template>
        <template data-sc="if" value="{{notOk}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="btn off" aria-disabled="true">Verbindlich anmelden</button>
        </template>
      </div>
    </div>
  </template>

  <template data-sc="if" value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px">
      <div style="width: 84px; height: 84px; border-radius: 50%; background: #DCEFDF; color: #1E5A2E; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 44px; height: 44px; stroke-width: 2.2"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
      <h2 style="font-size: 26px">Ihr seid dabei!</h2>
      <p style="margin: 0; line-height: 1.5">{{doneText}}</p>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
        <button type="button" class="btn sec">Zum Kalender hinzufügen</button>
        <a class="btn pri" href="AppFeed.dc.html">Zurück zu den News</a>
      </div>
    </div>
  </template>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const group = (s.mode ?? 'group') === 'group';
    const persons = s.persons ?? 4;
    const ok = s.ok ?? false;
    const done = s.done ?? false;
    const n = group ? persons : 1;
    return {
      form: !done, done,
      group, single: !group,
      setGroup: () => this.setState({ mode: 'group' }),
      setSingle: () => this.setState({ mode: 'single' }),
      nameLabel: group ? 'Name der Gruppe oder Familie' : 'Dein Name',
      persons,
      minus: () => this.setState({ persons: Math.max(2, persons - 1) }),
      plus: () => this.setState({ persons: Math.min(12, persons + 1) }),
      ok, notOk: !ok,
      toggleOk: () => this.setState({ ok: !ok }),
      submit: () => this.setState({ done: true }),
      doneText: (n === 1 ? '1 Person ist' : n + ' Personen sind') + ' für das Hüttenwochenende angemeldet. Die Bestätigung kommt per E-Mail.'
    };
  }
}
</script>
</body>
</html>
